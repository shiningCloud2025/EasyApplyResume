# ================================================
# EasyApplyResume Nginx API 网关配置
# 只负责后端 API 负载均衡
# ================================================
# 
# 架构：
#   前端容器 → 网关:80/api/ → 后端负载均衡
#
#   user:37222    ─┐
#   admin:37221   ─┼─ /api/ → nginx-gateway → backend-1, backend-2, ...
#   monitor:37223 ─┘
#
# ================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript;

    # 上传文件大小限制
    client_max_body_size 50M;

    # ============================================
    # 后端服务负载均衡（多实例）
    # 添加更多实例只需要在这里加 server
    # ============================================
    upstream backend_servers {
        # 负载均衡策略: 
        #   默认轮询 (round-robin)
        #   least_conn - 最少连接
        #   ip_hash - 会话保持
        # least_conn;
        # ip_hash;
        
        server EasyApplyResume-backend-1:8080 weight=1;
        server EasyApplyResume-backend-2:8080 weight=1;
        # server EasyApplyResume-backend-3:8080 weight=1;  # 按需添加
        
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ============================================
        # 后端 API 代理（负载均衡）
        # ============================================
        location /api/ {
            proxy_pass http://backend_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            
            # 后端连接保持
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ============================================
        # 健康检查
        # ============================================
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # 其他请求返回 404
        location / {
            return 404 'API Gateway - Use /api/ path';
            add_header Content-Type text/plain;
        }
    }
}
