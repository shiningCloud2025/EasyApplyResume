# ================================================
# EasyApplyResume Nginx 反向代理配置
# 通过路径区分不同服务（无域名方案）
# ================================================
# 访问方式：
#   - http://IP/          -> 用户端
#   - http://IP/admin/    -> 管理端
#   - http://IP/monitor/  -> 监控端
#   - http://IP/api/      -> 后端API
# ================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 上传文件大小限制
    client_max_body_size 50M;

    # 后端服务
    upstream backend_server {
        server EasyApplyResume-backend:8080;
        keepalive 32;
    }

    # 管理端前端
    upstream admin_server {
        server EasyApplyResume-admin:80;
    }

    # 用户端前端
    upstream user_server {
        server EasyApplyResume-user:80;
    }

    # 监控端前端
    upstream monitor_server {
        server EasyApplyResume-admonitor:80;
    }

    server {
        listen 80;
        server_name _;

        # ============================================
        # 后端 API 代理
        # ============================================
        location /api/ {
            proxy_pass http://backend_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ============================================
        # API 文档中心 (Knife4j/Swagger)
        # ============================================
        location /doc.html {
            proxy_pass http://backend_server/doc.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Knife4j/Swagger 静态资源
        location /webjars/ {
            proxy_pass http://backend_server/webjars/;
            proxy_set_header Host $host;
        }

        # Swagger 资源接口
        location /swagger-resources {
            proxy_pass http://backend_server/swagger-resources;
            proxy_set_header Host $host;
        }

        # OpenAPI 文档
        location /v3/api-docs {
            proxy_pass http://backend_server/v3/api-docs;
            proxy_set_header Host $host;
        }

        # Knife4j 分组接口
        location /swagger-resources/configuration/ {
            proxy_pass http://backend_server/swagger-resources/configuration/;
            proxy_set_header Host $host;
        }

        # ============================================
        # 管理端前端 (路径前缀: /admin)
        # ============================================
        location /admin/ {
            proxy_pass http://admin_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 管理端静态资源
        location /admin/assets/ {
            proxy_pass http://admin_server/assets/;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ============================================
        # 监控端前端 (路径前缀: /monitor)
        # ============================================
        location /monitor/ {
            proxy_pass http://monitor_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 监控端静态资源
        location /monitor/assets/ {
            proxy_pass http://monitor_server/assets/;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ============================================
        # 用户端前端 (默认路径: /)
        # ============================================
        location / {
            proxy_pass http://user_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://user_server;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 健康检查
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
